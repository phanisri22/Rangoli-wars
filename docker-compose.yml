name: rangoli-wars

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    JAVA_OPTS: -Xmx256m -XX:+UseSerialGC

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      LEADERBOARD_DB_PASSWORD: ${LEADERBOARD_DB_PASSWORD:?set LEADERBOARD_DB_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./deploy/oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  auth-service:
    <<: *java-service
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: auth-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      oracle: { condition: service_healthy }

  game-service:
    <<: *java-service
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: game-service } }
    environment:
      <<: *java-env
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      LEADERBOARD_URL: http://leaderboard-service:8083

  leaderboard-service:
    <<: *java-service
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: leaderboard-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: leaderboard_svc
      DB_PASSWORD: ${LEADERBOARD_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GAME_SERVICE_URL: http://game-service:8082
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      oracle: { condition: service_healthy }

  gateway:
    <<: *java-service
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: gateway } }
    environment:
      <<: *java-env
      AUTH_SERVICE_URL: http://auth-service:8081
      GAME_SERVICE_URL: http://game-service:8082
      GAME_SERVICE_WS_URL: ws://game-service:8082
      LEADERBOARD_URL: http://leaderboard-service:8083
    depends_on: [auth-service, game-service, leaderboard-service]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on: [gateway]

volumes:
  oracle-data:
