server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: game-socket
              uri: ${GAME_SERVICE_WS_URL:ws://localhost:8082}
              predicates:
                - Path=/ws/**
            - id: game
              uri: ${GAME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/game/**
            - id: leaderboard
              uri: ${LEADERBOARD_URL:http://localhost:8083}
              predicates:
                - Path=/api/leaderboard/**,/soap/**,/admin/**
              # keeps the public host in the WSDL address and admin redirects
              filters:
                - PreserveHostHeader

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
